name: Deploy to Cloud Run via WIF

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: "ecotech-tw"
  PROJECT_NUMBER: "211536603435"
  REGION: "asia-east1"
  SERVICE_NAME: "eco-tech-website"
  IMAGE_URL: "asia-east1-docker.pkg.dev/ecotech-tw/eco-tech-website/eco-tech-website"

jobs:
  deploy:
    name: Build and Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Build Info
        run: |
          echo "正在為專案 ecotech-tw 執行部署"
          echo "當前提交編號: ${{ github.sha }}"
          echo "執行者: ${{ github.actor }}"

      - name: Google Auth via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: "access_token"
          workload_identity_provider: "projects/211536603435/locations/global/workloadIdentityPools/github-actions-pool/providers/github-oidc-v2"
          service_account: "github-actions-deployer@ecotech-tw.iam.gserviceaccount.com"

      - name: Docker Auth
        uses: docker/login-action@v3
        with:
          username: "oauth2access"
          password: "${{ steps.auth.outputs.access_token }}"
          registry: "asia-east1-docker.pkg.dev"

      - name: Build and Push Container
        run: |
          docker build -t ${{ env.IMAGE_URL }}:${{ github.sha }} .
          docker tag ${{ env.IMAGE_URL }}:${{ github.sha }} ${{ env.IMAGE_URL }}:latest
          docker push ${{ env.IMAGE_URL }}:${{ github.sha }}
          docker push ${{ env.IMAGE_URL }}:latest

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_URL }}:${{ github.sha }}
          flags: "--allow-unauthenticated"

      - name: Show service URL
        run: echo "部署成功！網站網址是： ${{ steps.deploy.outputs.url }}"
